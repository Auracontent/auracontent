channel_name: "finance"
# Branche feat/finance-video seulement : finance activée pour l'arrêt 2 lancé depuis GitHub Actions (vidéo et
# légende déposées sur Hugging Face dans finance/, historique dans meta/finance/ ; rien publié sur TikTok ni
# YouTube). Repasse à false avant fusion dans main tant que les secrets de publication ne sont pas en place.
enabled: true
description: "Capital Simple : les chiffres, sans jargon. Épargne, intérêts composés, inflation : un mécanisme, des chiffres calculés, en moins d'une minute."

# Historiques propres à la chaîne (assets/shared/state/finance/, meta/finance/ sur Hugging Face) :
# jamais mélangés à ceux de mystery.
state:
  isolated: true

# Brain (LLM)
brain:
  language: "fr"
  scene_count: 9            # plafond
  target_duration: 50       # secondes (surchargé par VIDEO_DURATION dans le workflow) ; cible 45-60 s
  seconds_per_scene: 7      # 50 s -> 7 scènes
  scene_count_tolerance: 0   # storyboard fixé par concept : nombre de scènes exact
  # Longueur calculée : (durée visée - question finale) x débit de la voix, en mots PRONONCÉS (montants en
  # toutes lettres). Rémy à -8 % : 2,6 mots/s mesurés (78 mots en 29,8 s). Accroche et fin courtes, le reste
  # réparti ; un script sous 90 % de la cible est régénéré avec les scènes à allonger et de combien.
  voice_words_per_second: 2.6
  cta_seconds: 3
  hook_words: 10
  end_words: 8
  # Clé Gemini propre à la chaîne (son propre quota) : secret GEMINI_API_KEY_FINANCE, jamais la clé de
  # mystery ; secret absent = chaîne arrêtée. Seul le nom du secret est journalisé.
  gemini_key_env: GEMINI_API_KEY_FINANCE
  script_max_retries: 4      # contrôles stricts (chiffres, sens, exagération) : jusqu'à 5 essais
  # Meilleur script gardé (le moins d'avertissements) ; si 3 scènes au plus posent problème, seules
  # elles sont réécrites (un appel court) au lieu de tout régénérer
  partial_rewrite_max_scenes: 3
  # Seul avertissement « trop court » et au moins 90 % du minimum de mots : une passe d'allongement
  # des scènes courtes, puis script accepté tel quel
  near_length_ratio: 0.9
  resume_max_attempts: 3
  # Sujet inscrit à l'historique seulement une fois la vidéo produite : si elle échoue (voix Edge
  # indisponible...), le sujet reste en attente
  history_after_video: true
  resume_max_days: 7
  veracity_topic_rounds: 2

  # 429 : fournisseur suivant sans attendre (Groq gpt-oss-20b : 8 000 tokens/min)
  rate_limit: fallback
  # 503 ou délai dépassé (Gemini saturé) : fournisseur suivant (Groq, Cloudflare...) sans réessayer le même
  unavailable: fallback
  # Gemini en panne 2 appels de suite (503, 5xx, délai dépassé ou 429) : écarté pour le reste du run
  disable_after_failures: {models: ["gemini"], after: 2}
  # Un script qui garde des avertissements de style est régénéré, jamais publié
  style_warnings: reject

  script_models: ["gemini", "gpt-oss-120b", "deepseek-chat"]   # fragments de nom
  script_wait_rounds: 2
  script_wait_seconds: 60
  simple_models: ["gpt-oss-20b", "llama-3.1-8b", "gpt-4.1-mini", "gpt-4o-mini", "glm-4.5-flash", "qwen-flash"]
  # Si tous les petits modèles échouent : repli sur les autres, Gemini compris ; seuls les gros modèles
  # du script restent exclus des tâches simples
  simple_fallback_excluded: ["gpt-oss-120b", "deepseek-chat"]

  # Style parlé : tutoiement, ton posé, phrases courtes, aucun jargon
  style:
    max_sentence_words: 14     # 14 (et non 12) : avec 100 mots sur 6-7 scènes, 12 mots par phrase bloquait le LLM
    max_hook_words: 12
    target_hook_words: 10      # longueur visée par le prompt, sous le maximum
    # Formulations absolues ou alarmistes (regex sur le texte en minuscules sans accents)
    hype_patterns: ["\\btout(?:e|es)? (?:ta|ton|tes) (?:richesse|argent|epargne|economies)", "\\bdetrui\\w*",
                    "\\bfortunes?\\b", "\\bruin\\w*", "\\btout perdre\\b", "\\bperdre tout\\b",
                    "\\benorm\\w*", "\\bmagiques?\\b", "\\bspectaculaire\\w*", "\\babsolument\\b",
                    "\\bcatastroph\\w*", "\\bdesastr\\w*", "\\bexplos\\w*", "\\bsecrets?\\b",
                    "\\bincroyable\\w*", "\\bdramatique\\w*", "\\bgrignote tout\\b"]
    # Mots interdits (terme : raison). JAMAIS écrits dans une consigne, un exemple ou une correction envoyés au
    # LLM (masqués en « [terme interdit] »). « achète » n'y est plus : « ce que ton argent peut acheter » décrit
    # le pouvoir d'achat ; seul l'ordre donné au spectateur est interdit (imperatives, en début de phrase).
    banned_words:
      rendement garanti: promesse de résultat
      gain garanti: promesse de résultat
      sans risque: promesse de sécurité
      placement sûr: promesse de sécurité
      valeur sûre: promesse de sécurité
      devenir riche: promesse d'enrichissement
      millionnaire: promesse d'enrichissement
      investis: ordre donné au spectateur
      conseil: recommandation personnalisée (la vidéo explique, elle ne recommande pas)
    # Ordre donné au spectateur, en début de phrase : la vidéo ne dit jamais quoi faire de son argent
    imperatives: ["achète", "investis", "place", "épargne", "souscris", "ouvre", "vends", "emprunte"]
    # Noms qui commencent comme un ordre (« Épargne de précaution : ... », « Place de parking ») : acceptés
    imperative_exceptions: ["épargne de précaution", "épargne :", "place de parking", "place de stationnement",
                            "place de cinéma", "place de concert"]
    # Expressions courantes qui contiennent un mot interdit sans en avoir le sens (domaines études, famille...)
    allowed_contexts: ["bourse d'études", "bourses d'études", "bourse étudiante", "bourses étudiantes",
                       "bourse sur critères sociaux", "bourse du Crous", "bourse au mérite", "conseil de classe",
                       "conseil municipal", "conseil d'administration", "conseil de discipline"]
    # Verbes sans complément d'objet : « Dormir 1 000 € » n'a pas de sujet correct (on LAISSE dormir
    # 1 000 €, ou les 1 000 € dorment). Refusés quand un montant ou « ton argent » les suit directement.
    intransitive_verbs: ["dormir", "dors", "dort", "dorment", "grandir", "grandit", "grandissent", "fondre",
                         "fond", "fondent", "vieillir", "vieillit", "croitre", "croit", "gonfler", "gonfle",
                         "rouiller", "rouille", "stagner", "stagne"]
  # Question finale : une question sur le mécanisme, jamais une invitation à agir (placer, investir...)
  cta_banned:
    placement: invitation à agir
    placements: invitation à agir
    placer: invitation à agir
    places: invitation à agir
    commencer à placer: invitation à agir
    investir: invitation à agir
    investis: invitation à agir
    investissement: invitation à agir
    investissements: invitation à agir
    épargner: invitation à agir
  # Produits, banques et marques : jamais cités
  banned_names:
    livret A: nom de produit financier
    PEL: nom de produit financier
    LDDS: nom de produit financier
    assurance-vie: nom de produit financier
    PEA: nom de produit financier
    ETF: nom de produit financier
    SCPI: nom de produit financier
    bourse: marché financier (la vidéo ne parle d'aucun produit)
    crypto: actif financier (la vidéo ne parle d'aucun produit)
    bitcoin: actif financier (la vidéo ne parle d'aucun produit)
    # Noms d'établissements précis (banques, crédit, paiement fractionné) : le mot générique « banque » est
    # accepté (« les frais de ta banque », « compte en banque »), aucun établissement n'est cité
    BNP Paribas: nom d'établissement
    Crédit Agricole: nom d'établissement
    Société Générale: nom d'établissement
    LCL: nom d'établissement
    Crédit Lyonnais: nom d'établissement
    Caisse d'Épargne: nom d'établissement
    Banque Populaire: nom d'établissement
    Crédit Mutuel: nom d'établissement
    CIC: nom d'établissement
    Banque Postale: nom d'établissement
    BoursoBank: nom d'établissement
    Boursorama: nom d'établissement
    Fortuneo: nom d'établissement
    Hello bank: nom d'établissement
    Monabanq: nom d'établissement
    ING: nom d'établissement
    HSBC: nom d'établissement
    Revolut: nom d'établissement
    N26: nom d'établissement
    Orange Bank: nom d'établissement
    Qonto: nom d'établissement
    Lydia: nom d'établissement
    PayPal: nom d'établissement
    Klarna: nom d'établissement
    Cofidis: nom d'établissement
    Cetelem: nom d'établissement
    Sofinco: nom d'établissement
    Oney: nom d'établissement
    Floa: nom d'établissement
    Younited: nom d'établissement
  # Scène de fin : texte FIXE (jamais écrit par le LLM), exclu du contrôle des mots interdits
  disclaimer_text: "C'est un exemple simplifié et théorique, pas un conseil : chaque situation est différente."

  # Concepts permanents. Le sujet = concept + paramètres ; la déduplication porte sur les deux.
  # Les valeurs autorisées sont les seules que le script peut citer en entrée (les résultats viennent de calc.py).
  # Anti-répétition. Identité d'un sujet = concept + situation du quotidien :
  # - concept_window : un même concept (calcul) ne revient pas dans les 3 dernières vidéos, même avec d'autres
  #   chiffres ou une autre situation ;
  # - situation_window : un même couple concept + situation ne revient pas dans les 30 dernières vidéos.
  # Les sujets abandonnés comptent dans ces fenêtres. Sans sujet libre possible, le concept le moins récent revient.
  concept_window: 3
  situation_window: 30

  # Concepts du quotidien (calculs de calc.py sans entrée dans « concepts ») : exemple d'accroche (clés de calc.py
  # et paramètres entre accolades, valeurs réelles du sujet) et, pour le taux réel et le salaire, la règle
  # « perdre » : une perte n'est vraie qu'en pouvoir d'achat.
  daily_concepts:
    depenses_repetees: {hook_example: "Ce petit plaisir quotidien coûte {over_years} en {years} ans."}
    abonnements: {hook_example: "Tes abonnements oubliés coûtent {total_year} par an."}
    remises_successives: {hook_example: "{first} puis {second} de remise ne font pas {naive_pct}."}
    paiement_fractionne: {hook_example: "Payer en {installments} fois coûte {extra_cost} de plus."}
    credit_amortissable: {hook_example: "Ce crédit coûte {interest} rien qu'en intérêts."}
    decouvert_agios: {hook_example: "Quelques jours dans le rouge coûtent {agios}."}
    forfait_appareil: {hook_example: "Le téléphone à {upfront} coûte vraiment {real_price}."}
    carte_fidelite: {hook_example: "{pct} offerts ne font que {effective_pct} de remise."}
    epargne_age: {hook_example: "Commencer à {age_a} ans rapporte {gap} de plus."}
    leasing_epargne: {hook_example: "{monthly} par mois : rien à la fin, ou {saving_final}."}
    taux_reel:
      hook_example: "Ton livret à {nominal} ne rapporte que {real_exact}."
      wording: "Les intérêts arrivent bien sur le compte : seul le gain réel, inflation retirée, est plus faible. INTERDIT : dire que tu perds des euros (« tu perds {real_approx} »). AUTORISÉ : « ton gain réel n'est que de {real_gain} », « en pouvoir d'achat, tu gagnes {real_exact} »."
      loss_needs: ["pouvoir d'achat", "valeur réelle", "gain réel", "en réel"]
      loss_fixes: ["ton gain réel n'est que de {real_gain}", "en pouvoir d'achat, tu gagnes {real_exact}"]
    salaire_vs_prix:
      hook_example: "{raise_pct} de salaire, et ton pouvoir d'achat varie de {real_change_pct}."
      wording: "Le salaire augmente bien en euros : seul ce qu'il permet d'acheter change. INTERDIT : dire que tu perds des euros de salaire. AUTORISÉ : « ton pouvoir d'achat varie de {real_change_pct} », « ton salaire achète l'équivalent de {real_salary} d'aujourd'hui »."
      loss_needs: ["pouvoir d'achat", "valeur réelle", "en réel", "ce qu'il achète", "ce que ton salaire achète"]
      loss_fixes: ["ton pouvoir d'achat varie de {real_change_pct}", "ton salaire achète l'équivalent de {real_salary} d'aujourd'hui"]

  # Génération libre de sujets ancrés dans le quotidien (partie 3). Le concept imposé par le workflow
  # (option « concept » -> FINANCE_CONCEPT) reste prioritaire. Échec de la génération = repli sur les
  # combinaisons des concepts ci-dessous.
  free_topics:
    enabled: true
    candidates: 8                # candidats NOUVEAUX demandés à chaque run
    domains_per_run: 2           # domaines tirés au hasard ; au moins la moitié des candidats y sont demandés
    examples_shown: 3            # exemples montrés au LLM (format seulement, jamais un catalogue)
    max_from_examples: 1         # candidats qui reprennent une situation des exemples, au plus
    domains: ["logement", "transport", "alimentation", "travail et salaire", "études", "famille",
              "loisirs et vacances", "santé", "numérique et abonnements", "banque et paiements",
              "administration et impôts", "consommation et soldes"]
    # Comparaison de deux situations : mots-clés normalisés (accents, pluriels, mots vides, synonymes) ;
    # part commune >= same : même situation ; < different : différentes ; entre les deux : le LLM tranche.
    similarity: {same: 0.75, different: 0.4}
    synonyms:
      cafe: ["café", "cafés", "expresso", "expressos", "cappuccino", "petit noir", "boisson chaude"]
      travail: ["bureau", "boulot", "job", "taf", "entreprise"]
      jour: ["matin", "matins", "jours", "quotidien", "quotidienne", "journée", "chaque jour", "tous les jours"]
      abonnement: ["abonnements", "streaming", "plateforme", "plateformes", "forfait mensuel"]
      telephone: ["téléphone", "smartphone", "portable", "mobile"]
      voiture: ["auto", "véhicule", "automobile"]
      soldes: ["solde", "promo", "promos", "promotion", "promotions", "remise", "remises", "réduction"]
      decouvert: ["découvert", "agios", "rouge", "négatif"]
      salaire: ["paie", "paye", "rémunération", "augmentation"]
    # Exemples : UNIQUEMENT le format attendu (3 tirés au hasard par run). « calcul » : un calcul de calc.py.
    examples:
      - {situation: "Léa prend un café à 2 € chaque matin avant d'aller au travail", calcul: {type: depenses_repetees, params: {amount: 2, per_week: 5, years: 10}}, question_spectateur: "Combien coûte vraiment ce café sur 1 an et sur 10 ans ?"}
      - {situation: "Hugo paie sa console 400 € en 4 fois et oublie une échéance", calcul: {type: paiement_fractionne, params: {price: 400, installments: 4, fee_pct: 2.2, late_fee: 15}}, question_spectateur: "Combien coûte vraiment un paiement en 4 fois ?"}
      - {situation: "Léa découvre trois abonnements qu'elle n'utilise plus sur son relevé", calcul: {type: abonnements, params: {sub_1: 13.49, sub_2: 9.99, sub_3: 5.99, years: 5}}, question_spectateur: "Combien coûtent des abonnements oubliés sur un an ?"}
      - {situation: "Hugo achète une voiture à crédit sur 5 ans", calcul: {type: credit_amortissable, params: {amount: 15000, rate: 6, years: 5}}, question_spectateur: "Combien coûtent les intérêts d'un crédit voiture ?"}
      - {situation: "Léa voit un pull à -30 % puis -20 % en caisse pendant les soldes", calcul: {type: remises_successives, params: {price: 100, first: 30, second: 20}}, question_spectateur: "Pourquoi -30 % puis -20 % ne font pas -50 % ?"}
      - {situation: "Hugo garde son argent sur un livret qui rapporte 3 % quand les prix montent de 2 %", calcul: {type: taux_reel, params: {nominal: 3, inflation: 2, amount: 1000}}, question_spectateur: "Que rapporte vraiment un livret une fois l'inflation retirée ?"}
      - {situation: "Léa obtient 3 % d'augmentation l'année où les prix montent de 3 %", calcul: {type: salaire_vs_prix, params: {salary: 2000, raise_pct: 3, inflation: 3}}, question_spectateur: "Une augmentation de 3 % rend-elle plus riche ?"}
      - {situation: "Hugo reste à découvert de 500 € pendant 10 jours en fin de mois", calcul: {type: decouvert_agios, params: {overdraft: 500, days: 10, rate: 16}}, question_spectateur: "Combien coûtent quelques jours de découvert ?"}
      - {situation: "Léa met de côté 50 € par mois dès 20 ans, Hugo dès 35 ans", calcul: {type: epargne_age, params: {monthly: 50, rate: 5, age_a: 20, age_b: 35, end_age: 65}}, question_spectateur: "Pourquoi commencer 15 ans plus tôt change tout ?"}
      - {situation: "Hugo prend un téléphone à 1 € avec un forfait à 45 € par mois pendant 24 mois", calcul: {type: forfait_appareil, params: {phone_price: 600, upfront: 1, monthly_with: 45, monthly_without: 15, months: 24}}, question_spectateur: "Combien coûte vraiment un téléphone à 1 € ?"}
      - {situation: "Léa reçoit 10 % offerts en bon d'achat avec sa carte de fidélité", calcul: {type: carte_fidelite, params: {spend: 100, pct: 10}}, question_spectateur: "10 % offerts, est-ce vraiment 10 % de réduction ?"}
      - {situation: "Hugo roule en voiture en leasing à 300 € par mois quand Léa met la même somme de côté", calcul: {type: leasing_epargne, params: {monthly: 300, years: 4, rate: 3}}, question_spectateur: "Avoir l'air riche ou l'être vraiment : que reste-t-il après 4 ans ?"}
  # Le LLM choisit parmi un candidat inédit par concept (résultats déjà calculés par calc.py) ; « random » :
  # tirage au hasard. En cas d'échec du LLM, tirage au hasard.
  concept_selection: "llm"
  # Aucun taux de rendement au-dessus de 8 %/an (combinaisons écartées même si le YAML en propose)
  max_rate: 8
  # Sens des chiffres : contrôle par le code (unités, « par mois »), puis un appel LLM reçoit la table de
  # calc.py et répond oui/non avec motif ; un « non » fait régénérer le script
  meaning_check: "llm"
  concepts:
    interets_composes:
      label: "intérêts composés"
      idea: "les gains rapportent à leur tour des gains : commencer tôt pèse plus que la mise"
      params:
        early_age: [18, 20, 22, 25]
        late_age: [35, 40, 45]
        early_amount: [100, 200, 500]
        late_amount_factor: [2, 3]
        rate: [5, 6, 7]
        end_age: [60, 65]
    inflation:
      label: "inflation"
      idea: "l'argent qui dort perd du pouvoir d'achat chaque année"
      # L'argent reste sur le compte : seule une perte « de pouvoir d'achat » est vraie. Toute « perte » sans ces
      # mots est rejetée (accroches, narration, bandeau, titre).
      # Formulations (clés de calc.py entre accolades) : données au LLM dès le premier appel
      wording: "La somme reste sur le compte : seul le pouvoir d'achat baisse. INTERDIT : dire que l'argent disparaît ou que tu perds des euros (« ton argent perd {lost} »). AUTORISÉ : « ton argent perd {lost_pct} de pouvoir d'achat », « tes {amount} n'ont plus que la valeur réelle de {real_value} », « ce que ton argent peut acheter baisse »."
      # Une phrase avec « perd / perdre / perte » n'est acceptée qu'avec l'une de ces expressions
      loss_needs: ["pouvoir d'achat", "valeur réelle", "ce que ton argent peut acheter"]
      # Reformulations proposées au LLM quand la règle est enfreinte
      loss_fixes: ["ton argent perd {lost_pct} de pouvoir d'achat", "tes {amount} n'ont plus que la valeur réelle de {real_value}"]
      params:
        amount: [1000, 5000, 10000]
        inflation: [2, 3, 4]
        years: [10, 20, 30]
    cout_du_temps:
      label: "coût du temps"
      idea: "attendre quelques années avant de commencer coûte plus cher qu'on ne le croit"
      params:
        monthly: [50, 100, 200]
        rate: [4, 5, 7]
        delay_years: [5, 10]
        horizon_years: [30, 40]
      # Accroche type (clés de calc.py entre accolades)
      hook_example: "Verser {paid_gap} de plus rapporte {cost} de plus."
    frais:
      label: "frais"
      idea: "un petit pourcentage de frais par an grignote une grosse part du résultat final"
      params:
        amount: [5000, 10000, 20000]
        rate: [5, 6, 7]
        fees: [0.5, 1, 2]
        years: [20, 30]
    regle_72:
      label: "règle des 72"
      idea: "la règle des 72 : 72 divisé par le taux donne à peu près le nombre d'années pour doubler ; deux taux comparés"
      constants: [72]           # nombres propres au concept, autorisés dans le texte
      params:
        rate: [2, 3, 4, 6, 8]
        rate_b: [3, 4, 6, 8]     # second exemple, toujours plus élevé que le premier

# Audio : Edge TTS seul (gratuit, sans quota), même voix à chaque vidéo. Aucun autre moteur : si Edge échoue,
# la vidéo échoue et le sujet reste en attente (brain.history_after_video), jamais une autre voix.
audio:
  engines: [edge]
  retries: 3                 # même voix jusqu'à 3 fois par scène (pause de 3 à 5 s), jamais une autre voix
  retry_pause: [3, 5]
  role_directions: false     # voix native : aucune consigne de jeu ajoutée selon le rôle de la scène
  edge:
    # Rémy ralenti à -8 % (choix du 15/11) : environ 2,6 mots/s, 45 s pour 100 mots avec la question finale
    narrator: {voice: "fr-FR-RemyMultilingualNeural", rate: "-8%", pitch: "+0Hz"}

# Vidéo (Composer). Polices, effets et bandeau propres à la chaîne ; fond papier clair.
video_composer:
  video_width: 1080
  video_height: 1920
  fps: 30
  transitions: ["fade"]
  transition_duration: 0.2
  voice_gain: 1.0
  music_gain: 0.0            # pas de musique
  fonts_dir: "finance/fonts"
  sfx_dir: "finance/sfx"
  require_all_scenes: true   # une scène en échec = vidéo refusée (jamais de vidéo tronquée)
  # Pic vrai du fichier final : le dernier encodage AAC dépassait la cible de loudnorm (−1,4 dBTP mesuré) ;
  # au-dessus, le gain de la piste audio est baissé puis remesuré
  final_true_peak: -1.5
  # Question finale : déjà écrite à la main sur la carte de fin, donc sans sous-titres ; pas de filigrane sur
  # les cartes de fin (le grand logo suffit)
  cta_scene: {subtitles: false, hide_watermark: true}
  source_credit_enabled: false

  watermark_filename: "capital_simple_watermark.png"
  watermark_width: 120
  watermark_opacity: 0.9
  watermark_x: 42
  watermark_y: 56

  # Bandeau permanent « AFFIRMATION | PUNCHLINE » : affirmation à l'encre, punchline noire sur or
  headline_persistent: true
  headline_font: "Poppins-Bold.ttf"
  headline_font_size: 84
  headline_chars_per_line: 20
  headline_max_lines: 3
  headline_y: 230
  headline_accent_color: "0xE0A526"
  headline_accent_text_color: "0x1A1A1A"
  headline_text_color: "0x1A1A1A"
  headline_border_ratio: 0
  headline_shadow_color: ""

  # Sous-titres Poppins, encre sur papier, chiffres en or ; au-dessus de y = 1440 (zone de sécurité)
  # MarginV=72 : bas des sous-titres à y=1440 (zone de sécurité), soit 1240-1440 sur deux lignes ; la scène
  # dessinée garde la bande 470-1235 (visuals.linework.layout)
  subtitle_style: "FontName=Poppins,FontSize=13,Bold=1,PrimaryColour=&H001A1A1A,OutlineColour=&H00EAF3F7,BorderStyle=1,Outline=1.2,Shadow=0,Alignment=2,MarginL=30,MarginR=60,MarginV=72"
  subtitle_uppercase: false
  subtitle_keep_numbers: true   # « 74 800 € » jamais coupé entre deux légendes
  subtitle_highlight_color: "#E0A526"

visuals:
  map_scene:
    enabled: false
  # Scènes dessinées (style de la vidéo test : papier quadrillé, trait à la main, Caveat) ; zones en pixels de
  # sortie. Contrôles bloquants : texte coupé, hors zone sûre, zones réservées, chevauchements, appuis.
  linework:
    background: "#F7F3EA"
    grid: true
    layout:
      safe: [60, 200, 930, 1440]     # marge gauche de 60 px
      reserved: {bandeau: [0, 200, 1080, 470], sous-titres: [0, 1240, 1080, 1440]}

mascot:
  enabled: false

# Publication : uniquement des NOMS de variables d'environnement, jamais les valeurs
publish:
  hf_repo: "soradata/AIShortvideos"
  hf_folder: "finance"
  zernio_key_env: "ZERNIO_API_KEY_FINANCE"
  platforms:
    - {platform: youtube, account_env: YOUTUBE_ACCOUNT_ID_FINANCE}
    - {platform: tiktok,  account_env: TIKTOK_ACCOUNT_ID_FINANCE}
  delay_between_platforms: 15
  stats:
    platform: null
    account_envs: [TIKTOK_ACCOUNT_ID_FINANCE, YOUTUBE_ACCOUNT_ID_FINANCE]
    limit: 20
  fallback_hashtags: "#finance #epargne #argent #capitalsimple"
  brand_hashtag: "#capitalsimple"
  caption_footer: "Contenu pédagogique, pas un conseil en investissement."

name: Release

on:
  push:
    branches:
      - main
      - pre-release

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22   # LTS (23 is an odd, short-lived release)

      # uv is needed by @semantic-release/exec to refresh uv.lock after bumping pyproject.toml
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        # conventionalcommits@8+ is required by the current semantic-release plugins (@7 breaks them)
        run: >
          npm install --no-save
          semantic-release
          @semantic-release/commit-analyzer
          @semantic-release/release-notes-generator
          @semantic-release/changelog
          @semantic-release/exec
          @semantic-release/git
          @semantic-release/github
          conventional-changelog-conventionalcommits@8

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }} # Fine-grained PAT (contents/issues/PR write) from Developer settings
        run: npx semantic-release

name: Générateurs de Vidéos IA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Chaîne à générer (nom du registre, ex : mystery)"
        required: false
        default: "mystery"
      topic:
        description: "Sujet de la vidéo (laisser vide pour choix automatique par l'IA)"
        required: false
        default: ""
      duration:
        description: "Durée souhaitée en secondes (20 à 90)"
        required: false
        default: "45"
      refine_angle:
        description: "Laisser l'IA reformuler l'angle du sujet"
        required: false
        default: "true"
      use_hook_variants:
        description: "Tester plusieurs hooks avant génération"
        required: false
        default: "true"
  repository_dispatch:
    types: [trigger-videos]

jobs:
  generate:
    permissions:
      contents: read
      models: read   # GitHub Models
    runs-on: ubuntu-24.04   # image figée : ubuntu-latest change de version sans prévenir
    timeout-minutes: 45
    env:
      CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel || 'mystery' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub Models (gratuit, aucun secret à créer)
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      EUROPEAN_API_KEY: ${{ secrets.EUROPEAN_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_R2_TOKEN }}
      WIKIMEDIA_CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}
      VIDEO_TOPIC: ${{ github.event.inputs.topic || '' }}
      VIDEO_DURATION: ${{ github.event.inputs.duration || '45' }}
      REFINE_ANGLE: ${{ github.event.inputs.refine_angle || 'true' }}
      USE_HOOK_VARIANTS: ${{ github.event.inputs.use_hook_variants || 'true' }}

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v7

      - name: ⚙️ Installer les paquets système (packages.txt)
        run: |
          sudo apt-get update
          grep -vE '^\s*(#|$)' packages.txt | xargs sudo apt-get install -y

      - name: ⚡ Installer uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 🐍 Configurer Python 3.12
        run: uv python install 3.12

      - name: 📦 Installer les dépendances (versions figées par uv.lock)
        run: uv sync --locked --group default --group media

      # Teste chaque service avec les vraies clés : arrêt en ~20 s si un service critique est KO
      - name: 🩺 Diagnostic des services
        run: uv run python -m auracontent.cli.doctor --require-hf

      - name: 🎬 Générer (${{ env.CHANNEL }})
        run: |
          # 2 tentatives : les pannes de configuration sont déjà écartées par le diagnostic
          for i in 1 2; do
            echo "Tentative $i..."
            uv run python -m auracontent.cli.generate $CHANNEL --upload --sync-state && exit 0
            echo "Échec de la tentative $i. Pause de 15 secondes avant de réessayer..."
            sleep 15
          done
          echo "Les 2 tentatives ont échoué."
          exit 1

      - name: 🔊 Vérifier le niveau sonore
        if: always()
        run: |
          video=$(ls output/*.mp4 2>/dev/null | head -n 1 || true)
          if [ -n "$video" ]; then
            ffmpeg -i "$video" -af loudnorm=print_format=summary -f null - 2>&1 | tee output/loudness_report.txt
          else
            mkdir -p output
            echo "Aucune vidéo finale trouvée dans output/." | tee output/loudness_report.txt
          fi

      - name: 💾 Sauvegarder les sorties (scripts, vidéo, rapport)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Output-${{ env.CHANNEL }}-${{ github.run_id }}
          path: output/
          if-no-files-found: warn

name: Générateurs de Vidéos IA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Chaîne à générer (mystery, finance, ou all pour les deux)"
        required: false
        default: "all"
      topic:
        description: "Sujet de la vidéo (laisser vide pour choix automatique par l'IA)"
        required: false
        default: ""
      duration:
        description: "Durée souhaitée en secondes (20 à 90)"
        required: false
        default: "45"
      refine_angle:
        description: "Laisser l'IA reformuler l'angle du sujet"
        required: false
        default: "true"
      use_hook_variants:
        description: "Tester plusieurs hooks avant génération"
        required: false
        default: "true"
      concept:
        description: "finance : calcul imposé (ex : remises_successives) ; vide = sujet libre du quotidien"
        required: false
        default: ""
      mystery_archive:
        description: "mystery : short d'archives réalisé par Claude (même sans la variable MYSTERY_MODE=archive)"
        type: boolean
        default: false
      archive_upload:
        description: "Short d'archives : déposer sur Hugging Face pour le Publisher (décocher pour un essai)"
        type: boolean
        default: true
      finance_actu:
        description: "finance : short « L'éco du jour » réalisé par Claude (actu sourcée, même sans FINANCE_MODE=actu)"
        type: boolean
        default: false
      actu_upload:
        description: "Short « L'éco du jour » : déposer sur Hugging Face pour le Publisher (décocher pour un essai)"
        type: boolean
        default: true
  repository_dispatch:
    types: [trigger-videos]

# Un seul workflow pour les deux chaînes, lancé par le cron (workflow_dispatch) ou par `trigger-videos` :
# - generate : finance, et mystery en mode automatique ;
# - direct   : mystery en short d'archives réalisé par Claude (docs/archive_shorts.md), quand la variable de dépôt
#              MYSTERY_MODE vaut `archive` (ou la case « mystery_archive » est cochée) ; generate saute alors mystery.
#
#  channel   | archive (variable ou case) | generate              | direct
#  all       | non                        | mystery + finance     | -
#  all       | oui                        | finance               | mystery
#  mystery   | case cochée                | -                     | mystery
#  mystery   | variable seule             | mystery (ancien mode, secours) | -
#  finance   | -                          | finance               | -
#
# Capital Simple, même principe : la variable de dépôt FINANCE_MODE=actu (ou la case « finance_actu ») remplace le
# format automatique par la tâche direct_finance (short « L'éco du jour » réalisé par Claude, docs/finance_actu.md).

jobs:
  generate:
    if: >-
      ${{ !((github.event.inputs.channel || github.event.client_payload.channel || 'all') == 'mystery' && inputs.mystery_archive == true)
       && !((github.event.inputs.channel || github.event.client_payload.channel || 'all') == 'finance'
            && (inputs.finance_actu == true || vars.FINANCE_MODE == 'actu')) }}
    # L'historique (sujets, hooks) est un état partagé sur HF : deux runs en parallèle
    # s'écraseraient. Les runs sont donc mis en file d'attente, sans annuler celui en cours.
    concurrency:
      group: auracontent-state
      cancel-in-progress: false
    permissions:
      contents: read
      models: read   # GitHub Models
    runs-on: ubuntu-26.04   # image figée : ubuntu-latest change de version sans prévenir
    timeout-minutes: 45
    env:
      CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel || 'all' }}
      FINANCE_CONCEPT: ${{ github.event.inputs.concept }}   # lu par finance seulement (prioritaire sur le sujet libre)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_FINANCE: ${{ secrets.GEMINI_API_KEY_FINANCE }}   # clé (et quota) propre à finance
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub Models (gratuit, aucun secret à créer)
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZERNIO_API_KEY_MYSTERY: ${{ secrets.ZERNIO_API_KEY_MYSTERY }}   # stats Zernio (bandit des hooks)
      ZERNIO_API_KEY_FINANCE: ${{ secrets.ZERNIO_API_KEY_FINANCE }}   # publication Capital Simple (absent = pas de publication)
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # tendances YouTube de la niche (absent = sans inspiration externe)
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_R2_TOKEN }}
      WIKIMEDIA_CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}
      VIDEO_TOPIC: ${{ github.event.inputs.topic || '' }}
      VIDEO_DURATION: ${{ github.event.inputs.duration || '45' }}
      REFINE_ANGLE: ${{ github.event.inputs.refine_angle || 'true' }}
      USE_HOOK_VARIANTS: ${{ github.event.inputs.use_hook_variants || 'true' }}
      MYSTERY_MODE: ${{ inputs.mystery_archive == true && 'archive' || vars.MYSTERY_MODE }}   # `archive` : mystery est réalisé par la tâche direct
      FINANCE_MODE: ${{ inputs.finance_actu == true && 'actu' || vars.FINANCE_MODE }}   # `actu` : finance est réalisé par la tâche direct_finance

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v7

      - name: ⚙️ Installer les paquets système (packages.txt)
        run: |
          sudo apt-get update
          grep -vE '^\s*(#|$)' packages.txt | xargs sudo apt-get install -y

      - name: ⚡ Installer uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 🐍 Configurer Python 3.12
        run: uv python install 3.12

      - name: 📦 Installer les dépendances (versions figées par uv.lock)
        run: uv sync --locked --group default --group media

      # Teste chaque service avec les vraies clés : arrêt en ~20 s si un service critique est KO
      - name: 🩺 Diagnostic des services
        run: uv run python -m auracontent.cli.doctor --require-hf

      # Génère mystery puis finance (ou uniquement la chaîne demandée)
      - name: 🎬 Générer les vidéos (${{ env.CHANNEL }})
        run: |
          if [ "$CHANNEL" = "all" ] && [ "$MYSTERY_MODE" = "archive" ]; then
            CHANNELS="finance"   # mystery : tâche direct (lancer channel=mystery à la main pour l'ancien mode, en secours)
            echo "mystery est réalisé par la tâche Réalisateur (MYSTERY_MODE=archive)."
          elif [ "$CHANNEL" = "all" ]; then
            CHANNELS="mystery finance"
          else
            CHANNELS="$CHANNEL"
          fi
          if [ "$CHANNEL" = "all" ] && [ "$FINANCE_MODE" = "actu" ]; then
            CHANNELS="${CHANNELS/finance/}"   # finance : tâche direct_finance (« L'éco du jour »)
            echo "finance est réalisé par la tâche Réalisateur finance (FINANCE_MODE=actu)."
          fi
          if [ -z "${CHANNELS// /}" ]; then echo "Aucune chaîne automatique à générer."; exit 0; fi

          for CH in $CHANNELS; do
            echo "=== Lancement de la chaîne : $CH ==="
            if [ "$CH" = "finance" ]; then
              if [ -z "$GEMINI_API_KEY_FINANCE" ]; then
                echo "::error::Secret GEMINI_API_KEY_FINANCE absent : finance n'utilise jamais la clé de mystery."
                exit 1
              fi
              ACTIVE_GEMINI="$GEMINI_API_KEY_FINANCE"
            else
              ACTIVE_GEMINI="$GEMINI_API_KEY"
            fi

            for i in 1 2; do
              echo "Tentative $i pour $CH..."
              GEMINI_API_KEY="$ACTIVE_GEMINI" uv run python -m auracontent.cli.generate "$CH" --upload --sync-state && break
              if [ "$i" -eq 2 ]; then
                echo "Les 2 tentatives ont échoué pour $CH."
                exit 1
              fi
              echo "Échec de la tentative $i. Pause de 15 secondes avant de réessayer..."
              sleep 15
            done
          done

      - name: 🔊 Vérifier le niveau sonore
        if: always()
        run: |
          video=$(ls output/*.mp4 2>/dev/null | head -n 1 || true)
          if [ -n "$video" ]; then
            ffmpeg -i "$video" -af loudnorm=print_format=summary -f null - 2>&1 | tee output/loudness_report.txt
          else
            mkdir -p output
            echo "Aucune vidéo finale trouvée dans output/." | tee output/loudness_report.txt
          fi

      - name: 💾 Sauvegarder les sorties (scripts, vidéo, rapport)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Output-${{ env.CHANNEL }}-${{ github.run_id }}
          path: output/
          if-no-files-found: warn

  # Réalisateur : Claude réalise un short d'archives mystery de bout en bout (docs/archive_shorts.md), puis la vidéo est
  # rendue et déposée sur Hugging Face ; le Publisher la publie comme d'habitude. Ex-workflow director.yml.
  direct:
    if: >-
      ${{ ((github.event.inputs.channel || github.event.client_payload.channel || 'all') == 'all'
           && (vars.MYSTERY_MODE == 'archive' || inputs.mystery_archive == true))
       || ((github.event.inputs.channel || github.event.client_payload.channel || 'all') == 'mystery'
           && inputs.mystery_archive == true) }}
    concurrency:
      group: director-mystery
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WIKIMEDIA_CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}
      TOPIC: ${{ github.event.inputs.topic || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Paquets système et Python
        run: |
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' packages.txt | xargs sudo apt-get install -y -qq
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12 && uv sync --locked --group default --group media

      - name: Dossier de l'épisode
        id: ep
        run: |
          D=$(date -u +%Y-%m-%d)
          echo "dir=episodes/archive/$D-a-nommer" >> "$GITHUB_OUTPUT"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Secret GEMINI_API_KEY absent : pas de voix."; exit 1; fi

      - name: Claude réalise le short
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          claude_args: "--max-turns 250 --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            Tu es le réalisateur de la chaîne « C'est arrivé ici ». Lis CLAUDE.md puis docs/archive_shorts.md en entier,
            et le modèle episodes/archive/_exemple/plan.json.
            ${{ github.event.inputs.topic != '' && format('Affaire imposée : « {0} ».', github.event.inputs.topic) || 'Choisis toi-même l''affaire (section 1), sans reprendre un sujet de episodes/archive/.' }}

            Crée le dossier episodes/archive/${{ steps.ep.outputs.date }}-<slug court>/ et réalise le short :
            recherche et vérification des faits (WebSearch, WebFetch), plan.json complet (voix, archives Commons, plans,
            habillage, musique, légende), puis dans l'ordre :
              uv run python -m auracontent.archive.cli <dossier> fetch
              (regarde chaque image avec Read pour placer les cadrages)
              uv run python -m auracontent.archive.cli <dossier> voice      (UNE seule fois si elle réussit : quota Gemini)
              uv run python -m auracontent.archive.cli <dossier> stills
            Lis stills.jpg, corrige plan.json et relance stills jusqu'à ce que la planche soit propre (section 9).
            Ne relance « voice » que si tu as changé le texte d'une phrase.
            Ne lance PAS « render » ni « upload » : l'étape suivante du workflow s'en charge.
            Termine par : git add <dossier> ; git commit -m "feat(mystery): short d'archives <slug>" ; git pull --rebase ; git push.
            Si quelque chose bloque, écris <dossier>/PROBLEME.md, commite-le et arrête-toi.

      - name: Retrouver l'épisode réalisé
        id: done
        run: |
          git pull -q --rebase || git pull -q
          E=$(ls -d episodes/archive/${{ steps.ep.outputs.date }}-*/ 2>/dev/null | sort | tail -n 1)
          E=${E%/}
          [ -n "$E" ] || { echo "::error::Aucun épisode créé aujourd'hui."; exit 1; }
          if [ -f "$E/PROBLEME.md" ]; then echo "::error::Le réalisateur s'est arrêté :"; cat "$E/PROBLEME.md"; exit 1; fi
          for f in plan.json stills.jpg voice/timing.json voice/voice.wav; do
            [ -f "$E/$f" ] || { echo "::error::manque $E/$f"; exit 1; }
          done
          echo "dir=$E" >> "$GITHUB_OUTPUT"

      - name: Rendu
        run: uv run python -m auracontent.archive.cli "${{ steps.done.outputs.dir }}" render

      - name: Vérifier le niveau sonore
        run: |
          V=$(ls "${{ steps.done.outputs.dir }}"/out/*.mp4 | head -n 1)
          ffmpeg -i "$V" -af ebur128 -f null - 2>&1 | grep -A1 "Integrated" | tail -n 1

      # Dépôt sauf essai manuel (case archive_upload décochée) ; le cron et `trigger-videos` déposent toujours
      - name: Déposer sur Hugging Face
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.archive_upload != false }}
        run: uv run python -m auracontent.archive.cli "${{ steps.done.outputs.dir }}" upload --channel mystery

      - name: Sauvegarder la vidéo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: short-archive-${{ github.run_id }}
          path: |
            episodes/archive/*/out/*.mp4
            episodes/archive/*/stills.jpg
          if-no-files-found: warn

  # Réalisateur finance : Claude réalise un short « L'éco du jour » (actualité économique sourcée, docs/finance_actu.md),
  # puis la vidéo est rendue et déposée sur Hugging Face ; le Publisher la publie comme d'habitude.
  direct_finance:
    if: >-
      ${{ contains(fromJSON('["all","finance"]'), github.event.inputs.channel || github.event.client_payload.channel || 'all')
       && (vars.FINANCE_MODE == 'actu' || inputs.finance_actu == true) }}
    concurrency:
      group: director-finance
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TOPIC: ${{ github.event.inputs.topic || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Paquets système et Python
        run: |
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' packages.txt | xargs sudo apt-get install -y -qq
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12 && uv sync --locked --group default --group media

      - name: Dossier de l'épisode
        id: ep
        run: |
          D=$(TZ=Europe/Paris date +%Y-%m-%d)
          echo "date=$D" >> "$GITHUB_OUTPUT"

      - name: Claude réalise le short
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          claude_args: "--max-turns 200 --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            Tu es le réalisateur de « Capital Simple », format « L'éco du jour ». Nous sommes le ${{ steps.ep.outputs.date }}.
            Lis CLAUDE.md puis docs/finance_actu.md en entier, et le modèle episodes/finance/_exemple/plan.json.
            ${{ github.event.inputs.topic != '' && format('Sujet imposé : « {0} ».', github.event.inputs.topic) || 'Choisis toi-même l''actualité économique du jour (section 1), sans reprendre un sujet récent de episodes/finance/.' }}

            Crée le dossier episodes/finance/${{ steps.ep.outputs.date }}-<slug court>/ et réalise le short :
            recherche de l'actualité et vérification de CHAQUE chiffre dans sa source (WebSearch, WebFetch ; sources
            primaires d'abord), plan.json complet (sources, voix avec « say », scènes, sync des courbes, légende), puis :
              uv run python -m auracontent.actu.cli <dossier> check
              uv run python -m auracontent.actu.cli <dossier> voice      (une seule fois si elle réussit)
              uv run python -m auracontent.actu.cli <dossier> stills
            Lis stills.jpg, corrige plan.json et relance stills jusqu'à ce que la planche soit propre (section 6).
            Ne relance « voice » que si tu as changé le texte d'une phrase.
            Ne lance PAS « render » ni « upload » : l'étape suivante du workflow s'en charge.
            Termine par : git add <dossier> ; git commit -m "feat(finance): éco du jour <slug>" ; git pull --rebase ; git push.
            Si quelque chose bloque (pas d'actualité chiffrable, sources introuvables, voix indisponible), écris
            <dossier>/PROBLEME.md, commite-le et arrête-toi : jamais de vidéo au rabais ni de chiffre non sourcé.

      - name: Retrouver l'épisode réalisé
        id: done
        run: |
          git pull -q --rebase || git pull -q
          E=$(ls -d episodes/finance/${{ steps.ep.outputs.date }}-*/ 2>/dev/null | sort | tail -n 1)
          E=${E%/}
          [ -n "$E" ] || { echo "::error::Aucun épisode créé aujourd'hui."; exit 1; }
          if [ -f "$E/PROBLEME.md" ]; then echo "::error::Le réalisateur s'est arrêté :"; cat "$E/PROBLEME.md"; exit 1; fi
          for f in plan.json stills.jpg voice/timing.json voice/voice.wav; do
            [ -f "$E/$f" ] || { echo "::error::manque $E/$f"; exit 1; }
          done
          uv run python -m auracontent.actu.cli "$E" check
          echo "dir=$E" >> "$GITHUB_OUTPUT"

      - name: Rendu
        run: uv run python -m auracontent.actu.cli "${{ steps.done.outputs.dir }}" render

      - name: Vérifier le niveau sonore
        run: |
          V=$(ls "${{ steps.done.outputs.dir }}"/out/*.mp4 | head -n 1)
          ffmpeg -i "$V" -af ebur128 -f null - 2>&1 | grep -A1 "Integrated" | tail -n 1

      # Dépôt sauf essai manuel (case actu_upload décochée) ; le cron et `trigger-videos` déposent toujours
      - name: Déposer sur Hugging Face
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.actu_upload != false }}
        run: uv run python -m auracontent.actu.cli "${{ steps.done.outputs.dir }}" upload --channel finance

      - name: Sauvegarder la vidéo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eco-du-jour-${{ github.run_id }}
          path: |
            episodes/finance/*/out/*.mp4
            episodes/finance/*/stills.jpg
          if-no-files-found: warn

name: Publisher [Bot]

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Chaînes à publier, séparées par des espaces (ex : mystery finance)"
        required: false
        default: "mystery"

jobs:
  publier_video:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHANNELS: ${{ github.event.inputs.channels || 'mystery' }}
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v7

      - name: ⚙️ Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: ⚡ Installer uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 🐍 Configurer Python 3.12
        run: uv python install 3.12

      - name: 📦 Installer les dépendances
        run: uv sync --locked --group default

      # Les noms des variables utilisées par chaque chaîne sont dans config/channels/<chaîne>.yaml (section publish)
      - name: 🚀 Publier
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # mystery
          ZERNIO_API_KEY_MYSTERY: ${{ secrets.ZERNIO_API_KEY_MYSTERY }}
          TIKTOK_ACCOUNT_ID_MYSTERY: ${{ secrets.TIKTOK_ACCOUNT_ID_MYSTERY }}
          YOUTUBE_ACCOUNT_ID_MYSTERY: ${{ secrets.YOUTUBE_ACCOUNT_ID_MYSTERY }}
        run: uv run python -m auracontent.cli.publish $CHANNELS

      - name: 💾 Sauvegarder les rapports de loudness
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Loudness-Reports-Publish-${{ github.run_id }}
          path: loudness_report_*.txt
          if-no-files-found: ignore
